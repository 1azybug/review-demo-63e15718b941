<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RACE-Bench · Open game</title>
  <style>
    html, body { margin: 0; background: #080c14; color: #e7eefc; font: 14px/1.5 -apple-system, "Segoe UI", Roboto, "Noto Sans SC", Arial, sans-serif; }
    #bar { min-height: 46px; display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 0 16px; background: #0d1420; border-bottom: 1px solid #1d2b42; }
    a { color: #8fb4ee; }
    #bar a { text-decoration: none; }
    #ttl { font-weight: 600; }
    #stat { margin-left: auto; color: #a9bdd9; font-size: 12px; }
    main { padding: 24px 16px; }
  </style>
</head>
<body>
  <nav id="bar">
    <a href="index.html">← Back / 返回</a>
    <span id="ttl">RACE-Bench</span>
    <span id="stat">(not recorded · 不记录)</span>
  </nav>
  <main>
    <a id="open-game" href="a/A1_Concentration/index.html">Open game / 打开游戏</a>
  </main>
  <script src="config.js"></script>
  <script>
    const requestedGame = new URLSearchParams(location.search).get('gid');
    const gamePath = /^([a-d])\/([A-D]\d+)_[A-Za-z0-9_]+$/.exec(requestedGame || '');
    const isLocalGame = gamePath && gamePath[1] === gamePath[2][0].toLowerCase();
    const game = isLocalGame ? requestedGame : 'a/A1_Concentration';
    const gameId = isLocalGame ? gamePath[2] : 'A1';
    const gameName = window.RACE_CFG?.names?.[gameId.toLowerCase()];
    if (gameName) document.getElementById('ttl').textContent = gameName + ' · ' + gameId;

    const gameUrl = game + '/index.html';
    document.getElementById('open-game').href = gameUrl;
    location.replace(gameUrl);
  </script>
</body>
</html>
